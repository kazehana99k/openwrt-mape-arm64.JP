# Tuning for MAP-E tunnels (matches reference mape.sh values).
# These take effect at boot via /etc/init.d/sysctl.

net.ipv4.ip_forward = 1

# rp_filter must be 0 because MAP-E SNAT replies arrive on a tunnel
# whose source addresses don't appear in the routing table.
net.ipv4.conf.all.rp_filter = 0
net.ipv4.conf.default.rp_filter = 0

# Reduce conntrack entries for short-lived NAT connections; the public
# IPv4 is shared and the port pool is small, so we recycle aggressively.
net.netfilter.nf_conntrack_tcp_timeout_established = 600
net.netfilter.nf_conntrack_tcp_timeout_time_wait = 30
net.netfilter.nf_conntrack_tcp_timeout_close_wait = 30
net.netfilter.nf_conntrack_udp_timeout = 30
net.netfilter.nf_conntrack_udp_timeout_stream = 60
net.netfilter.nf_conntrack_icmp_timeout = 10
